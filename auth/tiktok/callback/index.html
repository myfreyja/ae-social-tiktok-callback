<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TikTok Callback</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111;
        color: #f5f5f5;
      }

      main {
        max-width: 520px;
        padding: 24px;
      }

      a {
        color: #24d6c8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connecting TikTok...</h1>
      <p>If this page does not continue automatically, make sure AE Social Publisher helper is running.</p>
      <p><a id="manualLink" href="#">Continue to local helper</a></p>
    </main>
    <script>
      (function () {
        var target = "http://127.0.0.1:47831/auth/tiktok/callback" + window.location.search + window.location.hash;
        document.getElementById("manualLink").href = target;
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
